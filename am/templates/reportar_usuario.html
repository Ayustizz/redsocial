<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Red Social</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                <a class="nav-link" href="{% url 'buscar_usuarios' %}">Buscar</a>
                <a class="nav-link" href="{% url 'mis_amigos' %}">Amigos</a>
                <a class="nav-link" href="{% url 'solicitudes_amistad' %}">Solicitudes</a>
                <a class="nav-link" href="{% url 'logout' %}">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Reportar Usuario</h4>
                    </div>
                    <div class="card-body">
                        <p>Estás reportando a: <strong>{{ usuario_reportado.get_full_name|default:usuario_reportado.username }}</strong></p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="{{ form.tipo.id_for_label }}" class="form-label">Tipo de reporte:</label>
                                {{ form.tipo }}
                            </div>
                            
                            <div class="mb-3">
                                <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción:</label>
                                {{ form.descripcion }}
                                <div class="form-text">Describe detalladamente el motivo del reporte.</div>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{% url 'perfil' usuario_reportado.username %}" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-danger">Enviar Reporte</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
