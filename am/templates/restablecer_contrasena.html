<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - AM Media</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/am-media.css' %}">
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold text-primary">
                                    <i class="fas fa-lock me-2"></i>
                                    Nueva Contraseña
                                </h2>
                                <p class="text-muted">Ingresa tu nueva contraseña</p>
                            </div>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}

                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="nueva_contrasena" class="form-label">
                                        <i class="fas fa-key me-1"></i>
                                        Nueva contraseña
                                    </label>
                                    <input type="password" class="form-control" id="nueva_contrasena" name="nueva_contrasena" 
                                           placeholder="Mínimo 8 caracteres" required minlength="8">
                                </div>

                                <div class="mb-4">
                                    <label for="confirmar_contrasena" class="form-label">
                                        <i class="fas fa-check me-1"></i>
                                        Confirmar contraseña
                                    </label>
                                    <input type="password" class="form-control" id="confirmar_contrasena" name="confirmar_contrasena" 
                                           placeholder="Repite la contraseña" required minlength="8">
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    <i class="fas fa-save me-2"></i>
                                    Restablecer contraseña
                                </button>
                            </form>

                            <div class="text-center">
                                <a href="{% url 'two_factor:login' %}" class="text-decoration-none">
                                    <i class="fas fa-arrow-left me-1"></i>
                                    Volver al inicio de sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validar que las contraseñas coincidan
        document.getElementById('confirmar_contrasena').addEventListener('input', function() {
            const password = document.getElementById('nueva_contrasena').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Las contraseñas no coinciden');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
