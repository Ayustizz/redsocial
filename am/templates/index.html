<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Media - Red Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/am-media.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="min-vh-100 d-flex align-items-center" style="background: #001427;">
        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-lg-5 text-center mb-5 mb-lg-0">
                    <div class="fade-in-up">
                        <h1 class="display-2 fw-bold mb-4" style="color: #f4d58d;">
                            AM Media
                        </h1>
                        <p class="lead mb-4" style="color: #708d81;">
                            Conecta con amigos, comparte momentos especiales y descubre nuevas experiencias.
                        </p>
                    </div>
                </div>
                
                <div class="col-lg-5">
                    <div class="card fade-in-up" style="background: white; border: none; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h3 class="fw-bold" style="color: #001427;">¡Únete a AM Media!</h3>
                                <p style="color: #708d81;">Inicia sesión o regístrate para comenzar</p>
                            </div>
                            
                            <div class="d-grid gap-3">
                                <a href="{% url 'two_factor:login' %}" class="btn btn-lg" style="background: #001427; color: white; border: none; border-radius: 12px; padding: 1rem;">
                                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                                </a>
                                <a href="{% url 'register' %}" class="btn btn-lg" style="background: transparent; color: #001427; border: 2px solid #001427; border-radius: 12px; padding: 1rem;">
                                    <i class="fas fa-user-plus me-2"></i>Registrarse
                                </a>
                            </div>
                            
                            <div class="text-center mt-4">
                                <small style="color: #708d81;">
                                    ¿Nuevo en AM Media? 
                                    <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: #001427;">
                                        Crea tu cuenta gratis
                                    </a>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
    </script>
    
    <style>
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }
    </style>
</body>
</html>
