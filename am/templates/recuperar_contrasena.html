<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - AM Media</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/am-media.css' %}">
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold text-primary">
                                    <i class="fas fa-key me-2"></i>
                                    Recuperar Contraseña
                                </h2>
                                <p class="text-muted">Ingresa tu correo o teléfono para recuperar tu cuenta</p>
                            </div>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}

                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="identificador" class="form-label">
                                        <i class="fas fa-envelope me-1"></i>
                                        Correo electrónico o teléfono
                                    </label>
                                    <input type="text" class="form-control" id="identificador" name="identificador" 
                                           placeholder="ejemplo@correo.com o +1234567890" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Método de recuperación</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="email" value="email" checked>
                                        <label class="form-check-label" for="email">
                                            <i class="fas fa-envelope me-1"></i>
                                            Enviar enlace por correo electrónico
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="sms" value="sms">
                                        <label class="form-check-label" for="sms">
                                            <i class="fas fa-sms me-1"></i>
                                            Enviar código por SMS
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    <i class="fas fa-paper-plane me-2"></i>
                                    Enviar recuperación
                                </button>
                            </form>

                            <div class="text-center">
                                <a href="{% url 'two_factor:login' %}" class="text-decoration-none">
                                    <i class="fas fa-arrow-left me-1"></i>
                                    Volver al inicio de sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
